# Backup do banco e dos anexos no Supabase + mantém o projeto gratuito "acordado".
# ---------------------------------------------------------------------
# Por quê: o plano gratuito do Supabase pausa o projeto após ~7 dias sem
# uso. Esta tarefa conecta no banco 3 vezes por semana (o que conta como
# uso) e, no mesmo passo, gera um backup.
#
# Segurança: o repositório é PÚBLICO e os arquivos gerados pelo Actions
# podem ser baixados por qualquer conta do GitHub. Por isso o backup é
# CRIPTOGRAFADO com senha (AES-256) antes de sair da máquina. Sem a senha,
# o arquivo é inútil.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     -> string de conexão "Session pooler" do Supabase, com a senha do banco
#   BACKUP_PASSPHRASE   -> senha longa para criptografar o backup (guarde fora do GitHub!)
#   SUPABASE_SECRET_KEY -> chave "secret" do projeto (Project Settings > API Keys), usada SÓ para
#                          baixar os arquivos dos anexos do Storage. Sem ela, o backup do banco é
#                          feito normalmente e o fluxo avisa que os anexos não foram copiados.
#
# Saem dois arquivos criptografados no mesmo "artifact":
#   gestao-supabase-<data>.tar.gz.gpg -> banco (estrutura, dados e logins)
#   gestao-anexos-<data>.tar.gpg      -> arquivos dos anexos (imagens e PDF), nas mesmas pastas do Storage
#
# Como restaurar: veja a seção "Backup e restauração" do README.
name: Backup do Supabase

on:
  schedule:
    - cron: '23 6 * * 1,3,5'   # seg, qua e sex às 06:23 UTC (03:23 em Brasília)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-supabase
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      # Só para ler o endereço do projeto (Project URL) em web/config.js.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web/config.js
          sparse-checkout-cone-mode: false

      - name: Conferir segredos
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Cadastre os segredos SUPABASE_DB_URL e BACKUP_PASSPHRASE em Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ ${#BACKUP_PASSPHRASE} -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE muito curta. Use pelo menos 20 caracteres."
            exit 1
          fi

      - name: Gerar backup criptografado
        run: |
          set -euo pipefail
          umask 077
          DATA=$(date -u +%Y-%m-%d_%H%M)
          echo "DATA=$DATA" >> "$GITHUB_ENV"   # mesma data no nome do backup dos anexos
          mkdir -p saida tmp
          chmod 777 tmp   # o contêiner do PostgreSQL grava aqui

          # Roda as ferramentas do PostgreSQL pela imagem oficial (funciona em qualquer
          # versão do Ubuntu do GitHub). A senha vai por variável, nunca na linha de comando.
          pg() { docker run --rm -e DBURL="$SUPABASE_DB_URL" -e PGCONNECT_TIMEOUT=30 -v "$PWD/tmp:/out" "$1" sh -c "$2"; }

          # Usa a mesma versão principal do banco do Supabase (ex.: 17)
          VERSAO=$(pg postgres:17-alpine 'psql "$DBURL" -tAc "show server_version_num"' | tr -d '[:space:]' | cut -c1-2)
          echo "Versão do banco: $VERSAO"
          IMG="postgres:${VERSAO}-alpine"

          # 1) Estrutura + dados do sistema (tabelas, regras de permissão, funções).
          #    --inserts: comandos INSERT simples, que podem ser colados no SQL Editor.
          pg "$IMG" 'pg_dump "$DBURL" --no-owner --inserts --schema=public --schema=privado -f /out/01_sistema.sql'
          # 2) Logins (usuários do Supabase Auth, com as senhas já embaralhadas)
          pg "$IMG" 'pg_dump "$DBURL" --data-only --no-owner --inserts --table=auth.users --table=auth.identities -f /out/02_logins.sql'
          # 3) Resumo para conferência (sem dados pessoais)
          cat > tmp/resumo.sql <<'SQL'
          select 'quadros=' || (select count(*) from public.boards)
              || ' cartoes=' || (select count(*) from public.cards)
              || ' usuarios=' || (select count(*) from public.profiles)
              || ' auditoria=' || (select count(*) from public.audit_log)
              || ' anexos=' || coalesce((select count(*) from public.card_attachments), 0);
          SQL
          pg "$IMG" 'psql "$DBURL" -tA -f /out/resumo.sql > /out/resumo.txt'

          # Ajustes para o arquivo rodar no SQL Editor de um projeto novo:
          #  - remove as linhas \restrict / \unrestrict (comandos só do programa psql)
          #  - o esquema "public" já existe em projeto novo
          sed -i -E '/^\\(un)?restrict /d' tmp/01_sistema.sql tmp/02_logins.sql
          sed -i 's/^CREATE SCHEMA public;/CREATE SCHEMA IF NOT EXISTS public;/' tmp/01_sistema.sql
          echo "Resumo do backup: $(cat tmp/resumo.txt)"

          tar -C tmp -czf - 01_sistema.sql 02_logins.sql resumo.txt | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" \
            -o "saida/gestao-supabase-$DATA.tar.gz.gpg"
          rm -rf tmp
          ls -lh saida

      # Os arquivos dos anexos ficam no Storage, fora do banco: o pg_dump acima não os copia.
      - name: Copiar arquivos dos anexos (criptografado)
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::warning::Anexos NÃO copiados: cadastre o segredo SUPABASE_SECRET_KEY (Supabase > Project Settings > API Keys > Secret keys). O backup do banco foi feito normalmente."
            exit 0
          fi
          URL=$(sed -n "s/^ *url: *'\(https:[^']*\)'.*/\1/p" web/config.js)
          if [ -z "$URL" ]; then echo "::error::Não achei a Project URL em web/config.js."; exit 1; fi
          mkdir -p tmp/anexos saida
          chmod 777 tmp

          # Lista dos arquivos do depósito "anexos", lida direto do banco.
          docker run --rm -e DBURL="$SUPABASE_DB_URL" -e PGCONNECT_TIMEOUT=30 -v "$PWD/tmp:/out" postgres:17-alpine \
            sh -c 'psql "$DBURL" -tA -c "select name from storage.objects where bucket_id = '"'"'anexos'"'"' order by name" > /out/lista.txt'
          TOTAL=$(grep -c . tmp/lista.txt || true)
          echo "Arquivos no depósito: $TOTAL"
          if [ "$TOTAL" -eq 0 ]; then echo "Nenhum anexo para copiar."; rm -rf tmp; exit 0; fi

          # A chave vai num arquivo de cabeçalhos (não aparece na linha de comando).
          # Chave nova (sb_secret_...) vai só no "apikey"; a antiga (service_role, eyJ...) também no Authorization.
          printf 'apikey: %s\n' "$SUPABASE_SECRET_KEY" > tmp/cab.txt
          case "$SUPABASE_SECRET_KEY" in eyJ*) printf 'Authorization: Bearer %s\n' "$SUPABASE_SECRET_KEY" >> tmp/cab.txt ;; esac

          OK=0; FALHAS=0
          while IFS= read -r CAMINHO; do
            # Só caminhos no formato gravado pelo sistema: <quadro>/<cartão>/<id>.<extensão>
            if ! [[ "$CAMINHO" =~ ^[0-9]+/[0-9]+/[0-9a-fA-F-]+\.(png|jpg|webp|gif|pdf)$ ]]; then
              echo "::warning::Ignorado (nome fora do padrão): $CAMINHO"; FALHAS=$((FALHAS + 1)); continue
            fi
            mkdir -p "tmp/anexos/$(dirname "$CAMINHO")"
            if curl -fsS --retry 3 --retry-delay 2 -H @tmp/cab.txt \
                 "$URL/storage/v1/object/authenticated/anexos/$CAMINHO" -o "tmp/anexos/$CAMINHO"; then
              OK=$((OK + 1))
            else
              echo "::warning::Falha ao baixar: $CAMINHO"; FALHAS=$((FALHAS + 1)); rm -f "tmp/anexos/$CAMINHO"
            fi
          done < tmp/lista.txt
          rm -f tmp/cab.txt
          echo "Anexos copiados: $OK de $TOTAL (falhas: $FALHAS)"
          if [ "$OK" -eq 0 ]; then echo "::error::Nenhum anexo foi baixado. Confira o segredo SUPABASE_SECRET_KEY."; exit 1; fi
          if [ "$FALHAS" -gt 0 ]; then echo "::warning::$FALHAS anexo(s) não foram copiados. Veja os avisos acima."; fi

          # Imagens e PDF já são compactados: empacota sem comprimir de novo e criptografa (AES-256).
          tar -C tmp -cf - anexos | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" \
            -o "saida/gestao-anexos-$DATA.tar.gpg"
          rm -rf tmp
          ls -lh saida

      # Roda mesmo se a cópia dos anexos falhar: o backup do banco nunca se perde por causa dela.
      - name: Guardar backup (30 dias)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-supabase-${{ github.run_number }}
          path: saida/*.gpg
          retention-days: 30
          if-no-files-found: error
